databases:
  - name: bvps-db
    plan: free

services:
  - type: web
    name: bvps-api
    runtime: node
    plan: free
    nodeVersion: 20
    buildCommand: npm install && npm run build --workspace=@workspace/api-server
    preDeployCommand: npm run migrate --workspace=@workspace/db
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bvps-db
          property: connectionString
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Website ke har form (contact/admission/feedback/principal) ka alert
      # owner ke WhatsApp par bhejne ke liye. Key sirf usi phone se milti hai
      # jo CallMeBot ko "I allow callmebot to send me messages" bhejta hai.
      - key: CALLMEBOT_APIKEY
        sync: false
      # Resend se owner ko email (FormSubmit fallback rahega).
      - key: RESEND_API_KEY
        sync: false
